<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="./assets/img/favicon.ico">
    <title>Read-pdf</title>
    <link rel="stylesheet" href="./css/style.css?v=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    

</head>
<body>
    <div class="app">
        <header>
            <nav class="navbar">
                <div class="left-content">
                    <img src="./assets/img/logo.png" alt="Read-PDF Logo" class="logo">
                    <div class="brand">ReadPDF</div>
                    <button id="toggle-sidenav" class="sidenav-btn">
                        <span class="material-symbols-outlined">menu</span>
                    </button>
                </div>
                <div class="right-content">
                    <div class="upload-container">
                        <input type="file" id="file-input" accept="application/pdf">
                        <label for="file-input">Upload PDF</label>
                        <div class="file-info">
                            <div class="file-name" id="file-name"></div>
                            <button id="info-button" class="info-button" style="display: none;">
                                <span class="material-symbols-outlined">
                                    info
                                </span>
                            </button>
                        </div>
                    </div>
                </div>
            </nav>
            <div id="sidenav" class="sidenav">
                <a href="javascript:void(0)" class="closebtn" id="close-sidenav">&times;</a>
                <div class="profile">
                    <img src="./assets/img/avatar.png" alt="Profile Avatar" class="avatar">
                    <div class="profile-name">
                        John Doe
                    </div>
                    <div class="profile-email">
                        johndoe@email.com
                    </div>
                </div>
                <hr>
                <a href="#">Link 1</a>
                <a href="#">Link 2</a>
                <a href="#">Link 3</a>
                <a href="#">Link 4</a>
            </div>
        </header>
        <main class="main-content">
            <div id="pdf-container" class="pdf-container">
                <div id="book" class="turnjs">
                    <div class="pdf-description">Here your pdf file</div>
                </div>
                <div class="page-shadow"></div>
            </div>
            <div class="progress-bar" id="progress-bar">
                <div class="progress-bar-inner" id="progress-bar-inner"></div>
            </div> <!-- Ensure the inner div is present -->
    
    
            <div id="spinner" class="spinner"></div>
            <div class="paginator">
                Page <span id="current-page">1</span> of <span id="total-pages">0</span>
            </div>
        </main>
        <footer>
            <div>
                &copy; 2024 <span>software Naranja</span> - <a href="mailto:hnaranjog@gmail.com">Help</a>
            </div>
        </footer>
    </div>

    <div id="info-popup" class="popup">
        <div class="popup-content">
            <span class="close-button">&times;</span>
            <div class="card">
                <h2>File Information</h2>
                <p id="file-name-info"></p>
                <p id="file-size-info"></p>
                <p id="file-date-info"></p>
                <!-- Puedes agregar más información aquí -->
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
    <script src="./lib/pdfjs/pdf.min.js"></script>
    <script src="./lib/turnjs/turn.min.js"></script>
    <script src="./script.js"></script>
</body>
</html>
